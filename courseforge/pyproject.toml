[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "courseforge"
version = "0.1.0"
description = "Reproducible incremental course + explainer-video pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["edge-tts>=7.0", "numpy>=1.26"]

[project.scripts]
courseforge = "courseforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
